<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ListingLift</title>
  <style>
    :root { --bg: #f7f5f0; --card: #fff; --ink: #1d1b16; --muted: #6b665c; --accent: #e8590c; --line: #e4dfd4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171512; --card: #211e1a; --ink: #f1ede4; --muted: #a49d90; --accent: #ff7a2e; --line: #3a352e; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 40px 16px 80px; }
    h1 { font-size: 2.2rem; margin: 0 0 4px; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    .tag { color: var(--muted); margin: 0 0 28px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    textarea, select { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    textarea { min-height: 150px; resize: vertical; }
    .row { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
    .row select { flex: 1; min-width: 160px; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #out { margin-top: 20px; white-space: pre-wrap; display: none; }
    #copy { margin-top: 12px; background: transparent; color: var(--accent); border: 1px solid var(--accent); display: none; }
    .err { color: #d6336c; margin-top: 12px; }
  </style>
</head>
<body>
<main>
  <h1>Listing<span>Lift</span></h1>
  <p class="tag">Paste your product notes. Get a listing written for search, ready to post, in seconds.</p>

  <form class="card" id="form">
    <label for="product">What are you selling?</label>
    <textarea id="product" maxlength="4000" required
      placeholder="e.g. Hand-poured soy candle, 8oz amber jar, lavender + cedar, 50hr burn, cotton wick, made in Oregon"></textarea>
    <div class="row">
      <select id="platform" aria-label="Platform">
        <option value="etsy">Etsy</option>
        <option value="shopify">Shopify</option>
        <option value="amazon">Amazon</option>
        <option value="ebay">eBay</option>
      </select>
      <button id="go" type="submit">Write my listing</button>
    </div>
    <div id="err" class="err"></div>
  </form>

  <div class="card" id="out"></div>
  <button id="copy" type="button">Copy listing</button>
</main>
<script>
  const form = document.getElementById("form");
  const out = document.getElementById("out");
  const err = document.getElementById("err");
  const go = document.getElementById("go");
  const copy = document.getElementById("copy");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    out.textContent = "";
    out.style.display = "block";
    copy.style.display = "none";
    go.disabled = true;
    go.textContent = "Writing…";
    try {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          product: document.getElementById("product").value,
          platform: document.getElementById("platform").value,
        }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        out.style.display = "none";
        err.textContent = data.error || "Something went wrong.";
        return;
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        out.textContent += decoder.decode(value, { stream: true });
      }
      copy.style.display = "inline-block";
    } catch {
      err.textContent = "Network error. Please try again.";
    } finally {
      go.disabled = false;
      go.textContent = "Write my listing";
    }
  });

  copy.addEventListener("click", async () => {
    await navigator.clipboard.writeText(out.textContent);
    copy.textContent = "Copied!";
    setTimeout(() => (copy.textContent = "Copy listing"), 1500);
  });
</script>
</body>
</html>
